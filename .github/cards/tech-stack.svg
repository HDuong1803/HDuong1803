    <ellipse cx="9" cy="4" rx="6" ry="2.5" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
    <rect x="3" y="4" width="12" height="6" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
    <ellipse cx="9" cy="10" rx="6" ry="2.5" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
  </g>

  <text x="474" y="120"
