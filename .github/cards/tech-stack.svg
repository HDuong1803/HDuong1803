  </text>

  <!-- Infra & DevOps icon -->
  <g transform="translate(444,196)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#111111" stroke="#ffe0c2" stroke-width="1"/>
    <circle cx="9" cy="9" r="4" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
    <circle cx="9" cy="9" r="1.5" fill="#ffe0c2"/>
    <line x1="9" y1="3" x2="9" y2="0.5" stroke="#ffe0c2" stroke-width="0.8"/>
    <line x1="15" y1="9" x2="17.5" y2="9" stroke="#ffe0c2" stroke-width="0.8"/>
    <line x1="9" y1="15" x2="9" y2="17.5" stroke="#ffe0c2" stroke-width="0.8"/>
    <line x1="3" y1="9" x2="0.5" y2="9" stroke="#ffe0c2" stroke-width="0.8"/>
