  </text>
  <text x="474" y="268" fill="#b4b4b4" font-size="14"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    Observability: Sentry · Grafana · Prometheus
  </text>
  <text x="474" y="286" fill="#b4b4b4" font-size="14"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
