    <rect x="3" y="3" width="12" height="5" rx="1" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
    <rect x="3" y="10" width="12" height="5" rx="1" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
