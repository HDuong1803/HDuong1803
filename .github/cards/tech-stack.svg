<svg width="840" height="440" viewBox="0 0 840 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe0c2">
        <animate attributeName="stop-color"
                 values="#ffe0c2; #393028; #2a2a2a; #ffe0c2"
                 dur="10s"
                 repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#2a2a2a">
        <animate attributeName="stop-color"
                 values="#2a2a2a; #ffe0c2; #393028; #2a2a2a"
                 dur="10s"
                 repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe0c2"/>
      <stop offset="100%" stop-color="#c8b49a"/>
    </linearGradient>
  </defs>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="837" height="437" rx="24"
        fill="none"
        stroke="url(#borderGradient)"
        stroke-width="2"/>

  <!-- Background -->
  <rect x="4" y="4" width="832" height="432" rx="22" fill="#111111" />

  <!-- Title -->
  <text x="40" y="60"
        fill="url(#titleGradient)"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif"
        font-size="32"
        font-weight="600">
    Tech Stack
  </text>

  <text x="40" y="82"
        fill="#b4b4b4"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="13"
        font-style="italic">
    Tools I reach for to build, break, and ship systems in production.
  </text>

  <!-- Column separator -->
  <line x1="420" y1="100" x2="420" y2="410" stroke="#2a2a2a" stroke-width="1" />

  <!-- Icons + headings -->

  <!-- Languages icon -->
  <g transform="translate(40,106)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#111111" stroke="#ffe0c2" stroke-width="1"/>
    <path d="M7 4 L4 9 L7 14" stroke="#ffe0c2" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M11 4 L14 9 L11 14" stroke="#ffe0c2" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="70" y="120"
        fill="#ffe0c2"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif"
        font-size="16"
        font-weight="600">
    Languages
  </text>
  <text x="70" y="142"
        fill="#b4b4b4"
        font-size="14"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif">
    TypeScript · Go · Python · JavaScript · Dart
  </text>

  <!-- Backend & APIs icon -->
  <g transform="translate(40,181)">
    <rect x="0" y="0" width="18" height="18" rx="3" fill="#111111" stroke="#ffe0c2" stroke-width="1"/>
    <rect x="3" y="3" width="12" height="4" rx="1" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
    <rect x="3" y="8" width="12" height="4" rx="1" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
    <rect x="3" y="13" width="12" height="4" rx="1" fill="#2a2a2a" stroke="#ffe0c2" stroke-width="0.8"/>
